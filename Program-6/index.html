<!DOCTYPE html>
<html>
<head>
    <title>Simple Calculator</title>
    <style>
        body { font-family: Arial; text-align: center; margin-top: 50px; }
        .calculator { width: 250px; margin: auto; }
        input { width: 95%; padding: 10px; font-size: 20px; text-align: right; }
        button { width: 55px; padding: 12px; margin: 3px; font-size: 18px; }
    </style>
</head>
<body>

<h2>Simple Calculator</h2>

<div class="calculator">
    <input type="text" id="display" value="0" readonly><br><br>

    <button onclick="clearDisplay()">C</button>
    <button onclick="add('/')">÷</button>
    <button onclick="add('*')">×</button>
    <button onclick="add('-')">−</button><br>

    <button onclick="add('7')">7</button>
    <button onclick="add('8')">8</button>
    <button onclick="add('9')">9</button>
    <button onclick="add('+')">+</button><br>

    <button onclick="add('4')">4</button>
    <button onclick="add('5')">5</button>
    <button onclick="add('6')">6</button>
    <button onclick="calculate()">=</button><br>

    <button onclick="add('1')">1</button>
    <button onclick="add('2')">2</button>
    <button onclick="add('3')">3</button>
    <button onclick="add('0')">0</button><br>

    <button onclick="add('.')">.</button>
</div>

<script>
    let expression = "";

    function add(value) {
        if (expression === "Error") expression = "";
        expression += value;
        document.getElementById("display").value = expression;
    }

    function calculate() {
        try {
            if (expression === "") return;

            if (!/^[0-9+\-*/. ]+$/.test(expression))
                throw Error();

            let result = Function("return " + expression)();

            if (!isFinite(result))
                throw Error();

            expression = String(result);
            document.getElementById("display").value = expression;
        }
        catch {
            expression = "Error";
            document.getElementById("display").value = "Error";
        }
    }

    function clearDisplay() {
        expression = "";
        document.getElementById("display").value = "0";
    }

    document.addEventListener("keydown", function(event) {
        let key = event.key;

        if ("0123456789.+-*/".includes(key) && key !== "") {
            add(key);
        }
        else if (key === "Enter" || key === "=") {
            calculate();
        }
        else if (key === "Escape") {
            clearDisplay();
        }
        else if (key === "Backspace") {
            expression = expression.slice(0, -1);
            document.getElementById("display").value = expression || "0";
        }
    });
</script>

</body>
</html>
