<!DOCTYPE html>
<html>
<body>

<h2>Student Data</h2>
<button onclick="loadData()">Load Data</button>
<p id="msg"></p>

<table border="1" cellpadding="10">
    <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Course</th>
        </tr>
    </thead>
    <tbody id="data"></tbody>
</table>

<script>
function loadData() {
    document.getElementById("msg").innerHTML = "Loading...";

    fetch("https://raw.githubusercontent.com/vegapunk-hub/json_data/main/raw.json")
    .then(response => response.json())
    .then(students => {
        let output = "";

        students.forEach(student => {
            output += `<tr>
                <td>${student.id}</td>
                <td>${student.name}</td>
                <td>${student.course}</td>
            </tr>`;
        });

        document.getElementById("data").innerHTML = output;
        document.getElementById("msg").innerHTML = "Data loaded!";
    })
    .catch(() => {
        document.getElementById("msg").innerHTML = "Error loading data!";
    });
}
</script>

</body>
</html>
