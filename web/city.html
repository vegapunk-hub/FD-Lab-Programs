<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Ride | Arman's World</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Dots&family=M+PLUS+Rounded+1c:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css"></head>
<body><canvas id="c"></canvas>
<div id="start" class="over"><div class="card glass"><h2>Your ride is ready</h2><p>Drag to look around 360°. Press any WASD or arrow key to drive yourself.</p><button class="big" id="engine">Start the engine</button></div></div>
<div id="hud" class="hidden">
 <div class="top"><button id="mode">Free drive</button><button id="orbit">360° spin</button><button id="vt">Voice on</button><select id="lang"><option value="en">English</option><option value="ta">தமிழ்</option><option value="kn">ಕನ್ನಡ</option><option value="ml">മലയാളം</option><option value="te">తెలుగు</option><option value="ja">日本語</option><option value="hi">हिन्दी</option></select><button id="book" aria-label="Book">📖</button></div>
 <aside id="panel" class="glass off"></aside><div id="sub" class="glass"></div><nav id="nav"></nav>
 <div class="ctl"><button id="prev">Back</button><button id="next">Next stop</button></div>
 <div class="dpad"><button data-k="w">▲</button><button data-k="a">◀</button><button data-k="s">▼</button><button data-k="d">▶</button></div>
</div>
<div id="toast" class="glass"></div>
<div id="pop" class="over hidden"><div class="card glass"><h2 id="pt"></h2><p id="pb"></p><button id="pr" class="big">🔊 Read aloud</button><button id="px">Close</button></div></div>
<div id="outro" class="over hidden"><div class="card glass"><h2 id="oq"></h2><button class="big" id="yes">Yes, meet the boss</button><button id="no">Keep exploring</button></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="js/robot.js"></script><script src="js/data.js"></script><script src="js/city.js"></script></body></html>
