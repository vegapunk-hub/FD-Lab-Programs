<!DOCTYPE html>
<html>
<head>
  <title>Registration Form</title>

  <style>
    body {
      font-family: Arial;
      background: #eee;
    }

    form {
      width: 300px;
      margin: 40px auto;
      padding: 20px;
      background: white;
    }

    input, select, button {
      width: 100%;
      padding: 8px;
      margin: 5px 0;
      box-sizing: border-box;
    }

    input[type="radio"],
    input[type="checkbox"] {
      width: auto;
    }

    p {
      color: red;
      font-size: 13px;
    }

    button {
      background: green;
      color: white;
      border: 0;
    }

    #success {
      color: green;
    }
  </style>
</head>

<body>

<form onsubmit="return validate()">

  <h2>Registration Form</h2>

  <input id="name" placeholder="Full Name">
  <p id="n"></p>

  <input id="email" placeholder="Email">
  <p id="e"></p>

  <input id="pass" type="password" placeholder="Password">
  <p id="p"></p>

  Gender:
  <input type="radio" name="gender"> Male
  <input type="radio" name="gender"> Female
  <p id="g"></p>

  <select id="course">
    <option value="">Select Course</option>
    <option>BCA</option>
    <option>BBA</option>
    <option>B.Com</option>
  </select>
  <p id="c"></p>

  <input type="checkbox" id="terms"> I agree to terms
  <p id="t"></p>

  <button>Register</button>

</form>

<script>
function validate() {

  let ok = true;

  n.innerHTML = "";
  e.innerHTML = "";
  p.innerHTML = "";
  g.innerHTML = "";
  c.innerHTML = "";
  t.innerHTML = "";

  if (name.value == "") {
    n.innerHTML = "Enter name";
    ok = false;
  }

  if (email.value == "") {
    e.innerHTML = "Enter email";
    ok = false;
  }

  if (pass.value.length < 6) {
    p.innerHTML = "Minimum 6 characters";
    ok = false;
  }

  if (!document.querySelector('input[name="gender"]:checked')) {
    g.innerHTML = "Select gender";
    ok = false;
  }

  if (course.value == "") {
    c.innerHTML = "Select course";
    ok = false;
  }

  if (!terms.checked) {
    t.innerHTML = "Accept terms";
    ok = false;
  }

  if (ok)
    alert("Registration Successful!");

  return false;
}
</script>

</body>
</html>
